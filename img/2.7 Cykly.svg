<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Cykly for a while v Pythone</title>
  <desc id="desc">Dve schémy opakovania: for prechádza prvky postupnosti a while opakuje blok, kým platí podmienka.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#526174"/>
    </marker>
    <style>
      text{font-family:system-ui,sans-serif;fill:#17212f}
      .heading{font-size:27px;font-weight:700}
      .label{font-size:20px;font-weight:600}
      .small{font-size:17px}
      .line{fill:none;stroke:#526174;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="520" rx="28" fill="#f7f9fc"/>
  <text class="heading" x="250" y="58" text-anchor="middle">for — postupnosť hodnôt</text>
  <text class="heading" x="750" y="58" text-anchor="middle">while — podmienka</text>
  <g transform="translate(70 105)">
    <rect x="20" y="0" width="320" height="62" rx="16" fill="#dceeff" stroke="#1672c4" stroke-width="3"/>
    <text class="label" x="180" y="39" text-anchor="middle">range(1, 4)</text>
    <path class="line" d="M180 64v36"/>
    <rect x="42" y="108" width="276" height="62" rx="14" fill="#e9ddff" stroke="#673ab7" stroke-width="3"/>
    <text class="label" x="180" y="147" text-anchor="middle">vykonaj blok</text>
    <path class="line" d="M180 173v40"/>
    <rect x="12" y="220" width="84" height="54" rx="12" fill="#fff0b3" stroke="#d18a00" stroke-width="3"/>
    <rect x="138" y="220" width="84" height="54" rx="12" fill="#fff0b3" stroke="#d18a00" stroke-width="3"/>
    <rect x="264" y="220" width="84" height="54" rx="12" fill="#fff0b3" stroke="#d18a00" stroke-width="3"/>
    <text class="label" x="54" y="255" text-anchor="middle">1</text>
    <text class="label" x="180" y="255" text-anchor="middle">2</text>
    <text class="label" x="306" y="255" text-anchor="middle">3</text>
    <text class="small" x="180" y="314" text-anchor="middle">Každá hodnota raz</text>
  </g>
  <g transform="translate(570 105)">
    <rect x="20" y="0" width="320" height="62" rx="16" fill="#fff0b3" stroke="#d18a00" stroke-width="3"/>
    <text class="label" x="180" y="39" text-anchor="middle">platí podmienka?</text>
    <path class="line" d="M180 64v36"/>
    <rect x="42" y="108" width="276" height="62" rx="14" fill="#e9ddff" stroke="#673ab7" stroke-width="3"/>
    <text class="label" x="180" y="147" text-anchor="middle">vykonaj blok</text>
    <path class="line" d="M180 173v45h-125v-50"/>
    <text class="small" x="212" y="205">áno — opakuj</text>
    <path class="line" d="M342 30h55v215h-48"/>
    <text class="small" x="375" y="150" transform="rotate(90 375 150)">nie — skonči</text>
    <text class="small" x="180" y="314" text-anchor="middle">Stav musí viesť k zastaveniu</text>
  </g>
  <path d="M500 92v355" stroke="#d9dee7" stroke-width="2" stroke-dasharray="8 8"/>
  <text class="small" x="500" y="480" text-anchor="middle" fill="#5b6678">Pri každom cykle sleduj jeho hodnoty, podmienku a okamih ukončenia.</text>
</svg>
