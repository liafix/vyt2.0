<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Algoritmus rozdelený na podprogramy</title>
  <desc id="desc">Hlavný algoritmus pripraví výsledok pomocou troch spolupracujúcich podprogramov: získa vstupy, vykoná výpočet a vytvorí výstup.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#526174"/>
    </marker>
    <style>
      text{font-family:system-ui,sans-serif;fill:#17212f}
      .title{font-size:30px;font-weight:700}
      .heading{font-size:23px;font-weight:700}
      .label{font-size:19px;font-weight:600}
      .small{font-size:16px}
      .arrow{fill:none;stroke:#526174;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1000" height="520" rx="26" fill="#f7f9fc"/>
  <text class="title" x="500" y="52" text-anchor="middle">Rozlož problém na jasne oddelené časti</text>
  <rect x="320" y="88" width="360" height="78" rx="18" fill="#dceeff" stroke="#1672c4" stroke-width="3"/>
  <text class="heading" x="500" y="121" text-anchor="middle">Hlavný algoritmus</text>
  <text class="small" x="500" y="148" text-anchor="middle">koordinuje postup a spája výsledky</text>
  <path d="M500 166v36M165 202h670M165 202v34m335-34v34m335-34v34" fill="none" stroke="#526174" stroke-width="3"/>
  <g>
    <rect x="45" y="236" width="240" height="132" rx="16" fill="#e5f6e8" stroke="#25823c" stroke-width="3"/>
    <text class="heading" x="165" y="273" text-anchor="middle">Získaj vstupy</text>
    <text class="label" x="165" y="307" text-anchor="middle">Vstup → údaje</text>
    <text class="small" x="165" y="340" text-anchor="middle">samostatná zodpovednosť</text>
    <rect x="380" y="236" width="240" height="132" rx="16" fill="#fff0b3" stroke="#c38b00" stroke-width="3"/>
    <text class="heading" x="500" y="273" text-anchor="middle">Spracuj údaje</text>
    <text class="label" x="500" y="307" text-anchor="middle">Údaje → výsledok</text>
    <text class="small" x="500" y="340" text-anchor="middle">jasné rozhranie</text>
    <rect x="715" y="236" width="240" height="132" rx="16" fill="#f0e8ff" stroke="#673ab7" stroke-width="3"/>
    <text class="heading" x="835" y="273" text-anchor="middle">Zobraz výsledok</text>
    <text class="label" x="835" y="307" text-anchor="middle">Výsledok → správa</text>
    <text class="small" x="835" y="340" text-anchor="middle">samostatne sa testuje</text>
  </g>
  <path class="arrow" d="M285 302h88"/>
  <path class="arrow" d="M620 302h88"/>
  <rect x="218" y="414" width="564" height="58" rx="14" fill="#fff" stroke="#aeb9c8" stroke-width="2"/>
  <text class="label" x="500" y="450" text-anchor="middle">Menšie časti spolu vytvárajú úplné riešenie</text>
  <path d="M165 368v28h335v12M500 368v40M835 368v28H500" fill="none" stroke="#526174" stroke-width="2"/>
</svg>
