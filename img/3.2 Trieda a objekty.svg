<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Trieda a objekty</title>
  <desc id="desc">Trieda GameObject opisuje atribúty a metódy. Z nej vytvoríme viac inštancií, z ktorých každá má vlastné hodnoty atribútov.</desc>
  <defs><style>text{font-family:system-ui,sans-serif;fill:#17212f}.title{font-size:31px;font-weight:700}.head{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:17px}.arrow{fill:none;stroke:#526174;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526174"/></marker></defs>
  <rect width="1000" height="540" rx="26" fill="#f7f9fc"/>
  <text class="title" x="500" y="54" text-anchor="middle">Trieda opisuje, objekty uchovávajú vlastný stav</text>
  <rect x="315" y="92" width="370" height="190" rx="20" fill="#e3f2ff" stroke="#1672c4" stroke-width="3"/>
  <text class="head" x="500" y="132" text-anchor="middle">class GameObject</text>
  <path d="M340 150h320" stroke="#1672c4" stroke-width="2"/>
  <text class="label" x="500" y="184" text-anchor="middle">Atribúty: name, health, attack</text>
  <path d="M340 202h320" stroke="#1672c4" stroke-width="2"/>
  <text class="label" x="500" y="239" text-anchor="middle">Metódy: take_damage(), is_alive()</text>
  <path class="arrow" d="M500 284v45M168 329h664M168 329v33M500 329v33M832 329v33"/>
  <g>
    <rect x="48" y="370" width="240" height="110" rx="16" fill="#e5f6e8" stroke="#25823c" stroke-width="3"/>
    <text class="head" x="168" y="407" text-anchor="middle">player1</text><text class="small" x="168" y="440" text-anchor="middle">health = 100</text><text class="small" x="168" y="465" text-anchor="middle">attack = 20</text>
    <rect x="380" y="370" width="240" height="110" rx="16" fill="#fff0b3" stroke="#c38b00" stroke-width="3"/>
    <text class="head" x="500" y="407" text-anchor="middle">player2</text><text class="small" x="500" y="440" text-anchor="middle">health = 120</text><text class="small" x="500" y="465" text-anchor="middle">attack = 15</text>
    <rect x="712" y="370" width="240" height="110" rx="16" fill="#f0e8ff" stroke="#673ab7" stroke-width="3"/>
    <text class="head" x="832" y="407" text-anchor="middle">enemy</text><text class="small" x="832" y="440" text-anchor="middle">health = 80</text><text class="small" x="832" y="465" text-anchor="middle">attack = 10</text>
  </g>
  <text class="small" x="500" y="515" text-anchor="middle">Objekty zdieľajú definíciu metód, ale každý má vlastné hodnoty inštančných atribútov.</text>
</svg>
