<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Štyri dátové štruktúry v Pythone</title>
  <desc id="desc">List a tuple ukladajú usporiadané prvky; set uchováva jedinečné hodnoty; dict mapuje kľúče na hodnoty.</desc>
  <defs><style>text{font-family:system-ui,sans-serif;fill:#17212f}.head{font-size:30px;font-weight:700}.name{font-size:27px;font-weight:700}.body{font-size:19px}.code{font-family:Consolas,monospace;font-size:20px}</style></defs>
  <rect width="1000" height="520" rx="28" fill="#f7f9fc"/>
  <text class="head" x="500" y="55" text-anchor="middle">Vyber správnu kolekciu pre svoje údaje</text>
  <g transform="translate(45 95)">
    <rect width="430" height="165" rx="20" fill="#e3f2ff" stroke="#1672c4" stroke-width="3"/>
    <text class="name" x="28" y="48">list</text><text class="body" x="112" y="47">usporiadaný · meniteľný</text>
    <text class="code" x="28" y="100">[10, 20, 20, 30]</text><text class="body" x="28" y="138">indexy · duplicity povolené</text>
  </g>
  <g transform="translate(525 95)">
    <rect width="430" height="165" rx="20" fill="#f0e8ff" stroke="#673ab7" stroke-width="3"/>
    <text class="name" x="28" y="48">tuple</text><text class="body" x="145" y="47">usporiadaná · nemenná</text>
    <text class="code" x="28" y="100">(10, 20, 30)</text><text class="body" x="28" y="138">indexy · vhodná pre pevné údaje</text>
  </g>
  <g transform="translate(45 285)">
    <rect width="430" height="165" rx="20" fill="#fff2cc" stroke="#c38b00" stroke-width="3"/>
    <text class="name" x="28" y="48">set</text><text class="body" x="105" y="47">jedinečné prvky</text>
    <text class="code" x="28" y="100">{10, 20, 30}</text><text class="body" x="28" y="138">bez indexu · množinové operácie</text>
  </g>
  <g transform="translate(525 285)">
    <rect width="430" height="165" rx="20" fill="#e5f6e8" stroke="#25823c" stroke-width="3"/>
    <text class="name" x="28" y="48">dict</text><text class="body" x="112" y="47">kľúč → hodnota</text>
    <text class="code" x="28" y="100">{"meno": "Ján"}</text><text class="body" x="28" y="138">prístup podľa jedinečného kľúča</text>
  </g>
  <text class="body" x="500" y="492" text-anchor="middle">for prechádza prvky každej iterovateľnej kolekcie.</text>
</svg>
